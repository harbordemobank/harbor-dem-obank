
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Demo Banking</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#18324b}
header{background:#123454;color:white;padding:24px;text-align:center}
.notice{background:#fff0c2;padding:12px;text-align:center;font-weight:bold;font-size:13px}
main{max-width:700px;margin:24px auto;padding:16px}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
button{padding:11px 18px;border:0;border-radius:6px;color:white;cursor:pointer;margin:5px}
.approve{background:#16794b}.reject{background:#b42332}
.status{font-weight:bold;color:#a66b00}
.bankcard{background:linear-gradient(135deg,#163b60,#277b91);color:white;padding:22px;border-radius:14px}
</style>
</head>
<body>
<header>
<h1>Harbor Demo Banking</h1>
<p>Harbor Demo online banking</p>
</header>



  
<section class="card" id="authCard">
  <h2>Harbor Demo Banking</h2>
  <p>Create a demo account or sign in to an existing one.</p>

  <div style="display:flex;gap:10px;margin:16px 0;">
    <button type="button" onclick="showAuthForm('signup')"
      style="flex:1;background:#1769d2;color:white;padding:12px;border:0;border-radius:6px;">
      Sign Up
    </button>
    <button type="button" onclick="showAuthForm('signin')"
      style="flex:1;background:#16834a;color:white;padding:12px;border:0;border-radius:6px;">
      Sign In
    </button>
  </div>

  <div id="signupForm">
    <h3>Create a New Account</h3>
    <label for="fullName">Full name</label>
    <input id="fullName" type="text" placeholder="Enter your full name"
      autocomplete="name" style="display:block;width:95%;padding:10px;margin:8px 0;">

    <label for="signupEmail">Email address</label>
    <input id="signupEmail" type="email" placeholder="Enter your email address"
      autocomplete="email" style="display:block;width:95%;padding:10px;margin:8px 0;">

    <label for="signupPassword">Create password</label>
    <input id="signupPassword" type="password" placeholder="Create a password"
      autocomplete="new-password" style="display:block;width:95%;padding:10px;margin:8px 0;">

    <button type="button" onclick="signUp()"
      style="background:#1769d2;color:white;padding:12px;border:0;border-radius:6px;">
      Create Account
    </button>
  </div>

  <div id="signinForm" hidden>
    <h3>Sign In to Your Account</h3>
    <label for="signinEmail">Email address</label>
    <input id="signinEmail" type="email" placeholder="Enter your email address"
      autocomplete="username" style="display:block;width:95%;padding:10px;margin:8px 0;">

    <label for="signinPassword">Password</label>
    <input id="signinPassword" type="password" placeholder="Enter your password"
      autocomplete="current-password" style="display:block;width:95%;padding:10px;margin:8px 0;">

    <button type="button" onclick="signIn()"
      style="background:#16834a;color:white;padding:12px;border:0;border-radius:6px;">
      Sign In
    </button>
  </div>

  <p id="authMessage" role="status">Choose Sign Up or Sign In.</p>
  <button type="button" onclick="signOut()">Sign Out</button>
</section>

<script>
function showAuthForm(type) {
  document.getElementById('signupForm').hidden = type !== 'signup';
  document.getElementById('signinForm').hidden = type !== 'signin';
  document.getElementById('authMessage').textContent =
    type === 'signup'
      ? 'Enter your full name, email, and password.'
      : 'Enter your email and password to sign in.';
}
</script>


<section class="card">
<h2>Bank Card</h2>
<div class="bankcard">
<strong>HARBOR DEMO</strong>
<p>Bank CARD</p>
<p>DEMO USER</p>
</div>
</section>
</main>
<script>
function updateStatus(value){
document.getElementById('status').textContent=value;
document.getElementById('message').textContent='Demo status updated. No real transaction occurred.';
}
</script>
<footer style="text-align:center;padding:20px;color:#66758a">
Demo online banking.
</footer>
  
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://xuyzwadccxbcvhjdwjvh.supabase.co',
  'sb_publishable_XFtUhsrB0b8A-jJaY8caKw_K_qQht3l'
);

function showMessage(message) {
  const el = document.getElementById('authMessage');
  if (el) el.textContent = message;
}

window.signUp = async function () {
  const fullName = document.getElementById('fullName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;

  if (!fullName || !email || !password) {
    showMessage('Please enter your full name, email address, and password.');
    return;
  }

  showMessage('Creating your demo account...');

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: fullName },
      emailRedirectTo: window.location.href.split('#')[0]
    }
  });

  if (error) {
    showMessage('Sign-up error: ' + error.message);
  } else if (data.session) {
    showMessage('Demo account created. You are signed in.');
  } else {
    showMessage('Signup received. Check your email to confirm your account.');
  }
};

window.signIn = async function () {
  const email = document.getElementById('signinEmail').value.trim();
  const password = document.getElementById('signinPassword').value;

  if (!email || !password) {
    showMessage('Enter your email address and password.');
    return;
  }

  showMessage('Signing in...');

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage('Sign-in error: ' + error.message);
  } else {
    showMessage('Signed in successfully: ' + data.user.email);
window.location.reload();
  }
};

window.signOut = async function () {
  const { error } = await supabase.auth.signOut();
  showMessage(error
    ? 'Sign-out error: ' + error.message
    : 'You have signed out.');
};
</script>

</body>
</html>
